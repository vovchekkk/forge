services:
  forge-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    container_name: forge-runner
    restart: unless-stopped
    environment:
      FORGE_SERVER_URL: https://forge-ci.ru
      FORGE_SERVER_TOKEN: ${FORGE_SERVER_TOKEN:?set FORGE_SERVER_TOKEN}
      FORGE_RUNNER_NAME: ${FORGE_RUNNER_NAME:-pc-runner}
      FORGE_RUNNER_WORKSPACE: /workspaces
      FORGE_RUNNER_VOLUME: forge-workspace
      FORGE_GIT_USERNAME: ${FORGE_GIT_USERNAME:-}
      FORGE_GIT_PASSWORD: ${FORGE_GIT_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forge-workspace:/workspaces

volumes:
  forge-workspace:
    name: forge-workspace