name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: mvn verify (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify
