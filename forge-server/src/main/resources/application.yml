server:
  port: 8080

spring:
  application:
    name: forge-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forge}
    username: ${DB_USER:forge}
    password: ${DB_PASSWORD:forge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

forge:
  scheduler:
    interval: 1s
  runner:
    heartbeat-interval: 10s
    offline-threshold: 30s
    offline-check-interval: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.forgeci: DEBUG