server:
  port: 9090

spring:
  application:
    name: forge-runner

forge:
  server:
    url: ${FORGE_SERVER_URL:http://localhost:8080}
    token: ${FORGE_SERVER_TOKEN:local-dev-token}
  runner:
    name: ${FORGE_RUNNER_NAME:local-runner}
    workspace: ${FORGE_RUNNER_WORKSPACE:C:\Users\vl_ga\AppData\Local\Temp\forge-runner-workspace}
    poll-interval: 2s

logging:
  level:
    com.forgeci: INFO