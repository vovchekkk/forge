server:
  port: 9090

spring:
  application:
    name: forge-runner

forge:
  server:
    url: ${FORGE_SERVER_URL:http://localhost:8080}
    # Registration credential obtained from POST /api/runners (shown only once)
    token: ${FORGE_SERVER_TOKEN:local-dev-token}
  runner:
    name: ${FORGE_RUNNER_NAME:local-runner}
    workspace: ${FORGE_RUNNER_WORKSPACE:${user.home}/forge-runner-workspace}
    poll-interval: 2s
  git:
    username: ${FORGE_GIT_USERNAME:}
    password: ${FORGE_GIT_PASSWORD:}

logging:
  level:
    com.forgeci: INFO